<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Janamitra</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gov-header {
            background: var(--bg-white);
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 4px;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .emblem {
            height: 45px;
        }

        .logo-text .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ux4g-primary);
        }

        .page-content {
            padding-top: 100px;
            padding-bottom: 4rem;
        }

        .breadcrumb {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--ux4g-primary);
            text-decoration: none;
        }

        .breadcrumb span {
            color: var(--text-muted);
            margin: 0 8px;
        }

        .page-header {
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* Project Card */
        .project-card {
            padding: 0;
            margin-bottom: 2rem;
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
        }

        .project-img {
            height: 100%;
            min-height: 280px;
        }

        .project-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-details {
            padding: 2rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-ongoing {
            background: #d1fae5;
            color: #059669;
        }

        .status-planned {
            background: #dbeafe;
            color: #2563eb;
        }

        .status-completed {
            background: #e9d5ff;
            color: #7c3aed;
        }

        .project-details h2 {
            font-size: 1.5rem;
            margin: 1rem 0;
        }

        .progress-container {
            margin: 1.5rem 0;
            background: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--ux4g-primary), var(--ux4g-primary-light));
            border-radius: 5px;
            transition: width 1s ease-in-out;
        }

        .project-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .project-meta i {
            color: var(--ux4g-primary);
            margin-right: 6px;
        }

        @media (max-width: 900px) {
            .project-card {
                grid-template-columns: 1fr;
            }

            .project-img {
                min-height: 200px;
            }
        }

        /* Comments Section */
        .comments-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border-color);
        }

        .comments-section h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .comment-form {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
        }

        .comment-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: var(--ux4g-primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .comment-form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .comment-form-footer button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .btn-submit-comment {
            background: var(--ux4g-primary);
            color: white;
        }

        .btn-submit-comment:hover {
            background: #5a4fc9;
        }

        .btn-cancel-comment {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .btn-cancel-comment:hover {
            background: #d1d5db;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment {
            background: white;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid var(--ux4g-primary);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .comment-author {
            font-weight: 600;
            color: var(--text-dark);
        }

        .comment-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.5rem;
        }

        .comment-text {
            color: var(--text-dark);
            line-height: 1.5;
            margin-top: 0.5rem;
        }

        .comment-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            font-size: 0.85rem;
        }

        .comment-delete {
            color: var(--ux4g-danger);
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .comment-delete:hover {
            text-decoration: underline;
        }

        .no-comments {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            background: var(--bg-light);
            border-radius: var(--radius);
        }
    </style>
</head>

<body>
    <div class="tricolor-strip"></div>

    <header class="gov-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo-section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem"
                    class="emblem">
                <div class="logo-text">
                    <span class="title">JANAMITRA</span>
                </div>
            </a>
            <a href="../index.html" class="btn btn-outline" id="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </header>

    <main class="container page-content animate-fade-in">
        <nav class="breadcrumb">
            <a href="../index.html" id="breadcrumb-home">Home</a> <span>/</span> Panchayat Projects
        </nav>

        <div class="page-header">
            <h1>Panchayat Projects</h1>
            <p>Complete transparency on budget allocation and execution of infrastructure works.</p>
        </div>

        <!-- Projects Container -->
        <div id="projectsContainer">
            <!-- Projects will be loaded here dynamically -->
        </div>
    </main>

    <!-- Include Database and App Scripts -->
    <script src="../js/database.js"></script>
    <script src="../js/app.js"></script>
    <script>
        /**
         * Load and display projects with comments
         */

        const projectsContainer = document.getElementById('projectsContainer');

        function getStatusBadge(progress) {
            if (progress === 100) {
                return '<span class="status-badge status-completed"><i class="fas fa-check-circle"></i> Completed</span>';
            } else if (progress === 0) {
                return '<span class="status-badge status-planned"><i class="fas fa-clock"></i> Planned</span>';
            } else {
                return '<span class="status-badge status-ongoing"><i class="fas fa-spinner"></i> Ongoing</span>';
            }
        }

        function getProgressBarColor(progress) {
            if (progress === 100) {
                return 'background: linear-gradient(to right, #a855f7, #c084fc);';
            } else if (progress < 50) {
                return 'background: linear-gradient(to right, #0284c7, #38bdf8);';
            } else {
                return 'background: linear-gradient(to right, var(--ux4g-primary), var(--ux4g-primary-light));';
            }
        }

        function renderComments(projectId) {
            const comments = getProjectComments(projectId);
            const session = getSession();
            const citizenName = session?.userData?.citizen?.name || 'Unknown';

            if (comments.length === 0) {
                return '<div class="no-comments"><i class="fas fa-comment"></i> No comments yet. Be the first to share your thoughts!</div>';
            }

            return `
                <div class="comments-list">
                    ${comments.map(comment => `
                        <div class="comment">
                            <div class="comment-header">
                                <span class="comment-author">${comment.author}</span>
                                <span class="comment-meta">
                                    <span>${comment.date}</span>
                                    <span>${comment.time}</span>
                                </span>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                            ${comment.author === citizenName ? `
                                <div class="comment-actions">
                                    <a href="#" class="comment-delete" onclick="deleteComment('${projectId}', '${comment.id}'); return false;">Delete</a>
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProjectCard(project) {
            const session = getSession();
            const citizenName = session?.userData?.citizen?.name || 'Citizen';

            return `
                <div class="project-card card">
                    <div class="project-img">
                        <img src="../assets/hero_projects.png" alt="${project.name}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem;">
                    </div>
                    <div class="project-details">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            ${getStatusBadge(project.progress)}
                            <span style="font-weight: 700; color: var(--ux4g-primary); font-size: 1.1rem;">${project.progress}%</span>
                        </div>
                        <h2>${project.name}</h2>
                        <p>${project.description || 'No description provided'}</p>

                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${project.progress}%; ${getProgressBarColor(project.progress)}"></div>
                        </div>

                        <div class="project-meta">
                            <div><i class="fas fa-wallet"></i> Budget: ₹${project.budget_lakhs}L</div>
                            <div><i class="fas fa-calendar-alt"></i> Timeline: ${project.start_date} to ${project.end_date}</div>
                            <div><i class="fas fa-user-tie"></i> Contractor: ${project.contractor}</div>
                        </div>

                        <!-- Comments Section -->
                        <div class="comments-section">
                            <h3><i class="fas fa-comments"></i> Public Comments</h3>
                            
                            <div class="comment-form">
                                <textarea id="comment-${project.id}" placeholder="Share your feedback or questions about this project..."></textarea>
                                <div class="comment-form-footer">
                                    <button class="btn-cancel-comment" onclick="clearComment('${project.id}')">Clear</button>
                                    <button class="btn-submit-comment" onclick="submitComment('${project.id}', '${citizenName}')">Post Comment</button>
                                </div>
                            </div>

                            ${renderComments(project.id)}
                        </div>
                    </div>
                </div>
            `;
        }

        function loadProjects() {
            // Try session first, fallback to default panchayat for public viewing
            const session = getSession();
            const panchayatId = session?.panchayatId || 'P001';
            const projects = getProjectsByPanchayat(panchayatId);

            if (projects.length === 0) {
                projectsContainer.innerHTML = `
                    <div class="card" style="padding: 3rem; text-align: center; color: var(--text-muted);">
                        <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <h3>No Projects Yet</h3>
                        <p>Your panchayat doesn't have any projects yet. Check back soon!</p>
                    </div>
                `;
                return;
            }

            projectsContainer.innerHTML = projects.map(project => renderProjectCard(project)).join('');
        }

        window.submitComment = function (projectId, citizenName) {
            const textarea = document.getElementById(`comment-${projectId}`);
            const commentText = textarea.value.trim();

            if (!commentText) {
                alert('Please write a comment before posting.');
                return;
            }

            addProjectComment(projectId, citizenName, commentText);
            saveToStorage();

            textarea.value = '';
            loadProjects();
        };

        window.clearComment = function (projectId) {
            document.getElementById(`comment-${projectId}`).value = '';
        };

        window.deleteComment = function (projectId, commentId) {
            if (confirm('Are you sure you want to delete this comment?')) {
                deleteProjectComment(projectId, commentId);
                saveToStorage();
                loadProjects();
            }
        };

        // Load projects on page load
        document.addEventListener('DOMContentLoaded', loadProjects);

        // Handle navigation based on login status
        document.addEventListener('DOMContentLoaded', function () {
            const session = getSession();
            // DEBUG: console.log('Session check:', session);
            if (session && session.isLoggedIn) {
                const backBtn = document.getElementById('back-btn');
                const breadcrumbHome = document.getElementById('breadcrumb-home');

                if (backBtn) backBtn.href = 'dashboard.html';
                if (breadcrumbHome) {
                    breadcrumbHome.href = 'dashboard.html';
                    breadcrumbHome.textContent = 'Dashboard';
                }
            }
        });
    </script>
</body>

</html>
