<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Complaints | Janamitra Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gov-header {
            background: var(--bg-white);
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 4px;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .emblem {
            height: 45px;
        }

        .logo-text .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ux4g-primary);
        }

        .logo-text .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--ux4g-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Admin Layout */
        .admin-layout {
            padding-top: 90px;
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-white);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar-menu a {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: var(--radius);
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .sidebar-menu a:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .sidebar-menu a.active {
            background: var(--ux4g-primary);
            color: white;
        }

        /* Main Content */
        .admin-content {
            padding: 2rem;
            background: var(--bg-light);
        }

        .page-title {
            font-size: 1.75rem;
            margin-bottom: 2rem;
        }

        /* Filter and Sort */
        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .filter-group select {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Complaints Table */
        .table-card {
            padding: 0;
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            text-align: left;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background: var(--bg-light);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .complaint-id {
            font-weight: 600;
            color: var(--ux4g-primary);
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: #e0e7ff;
            color: #4c1d95;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-in-progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-resolved {
            background: #d1fae5;
            color: #065f46;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            margin-right: 0.5rem;
        }

        .btn-sm.view {
            background: var(--ux4g-info);
            color: white;
        }

        .btn-sm.view:hover {
            background: #0284c7;
        }

        .btn-sm.resolve {
            background: var(--ux4g-success);
            color: white;
        }

        .btn-sm.resolve:hover {
            background: #059669;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-white);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-in-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .complaint-detail {
            margin-bottom: 1.5rem;
        }

        .complaint-detail label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.5rem;
        }

        .complaint-detail p {
            color: var(--text-dark);
            margin: 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .modal-footer button {
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-cancel {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }

        .btn-update {
            background: var(--ux4g-primary);
            color: white;
        }

        .btn-update:hover {
            background: #5a4fc9;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .controls-bar {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .admin-content {
                padding: 1rem;
            }

            .page-title {
                font-size: 1.25rem;
                margin-bottom: 1.25rem;
            }

            .data-table th,
            .data-table td {
                padding: 0.75rem 1rem;
                font-size: 0.85rem;
            }

            .user-menu span {
                display: none;
            }

            .emblem {
                height: 35px;
            }

            .logo-text .title {
                font-size: 1rem;
            }

            .modal-content {
                padding: 1.25rem;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .table-card {
                overflow-x: auto;
            }

            .data-table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>
    <div class="tricolor-strip"></div>

    <header class="gov-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo-section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem"
                    class="emblem">
                <div class="logo-text">
                    <span class="title">JANAMITRA</span>
                    <span class="subtitle">Admin Panel</span>
                </div>
            </a>
            <div class="user-menu">
                <span>Admin: <strong id="adminName">Admin</strong></span>
                <div class="user-avatar" id="adminAvatar">AD</div>
                <a href="../index.html" class="btn btn-outline" style="padding: 8px 12px;"><i
                        class="fas fa-power-off"></i></a>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-title">Management</div>
            <ul class="sidebar-menu">
                <li><a href="admin_dashboard.html"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="admin_manage_projects.html"><i class="fas fa-project-diagram"></i> Manage Projects</a></li>
                <li><a href="admin_manage_schemes.html"><i class="fas fa-hand-holding-heart"></i> Manage Schemes</a>
                </li>
                <li><a href="admin_manage_complaints.html" class="active"><i class="fas fa-inbox"></i> Complaints</a>
                </li>
                <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content animate-fade-in">
            <h1 class="page-title">Manage Complaints</h1>

            <!-- Filters -->
            <div class="controls-bar">
                <div class="filter-group">
                    <label for="statusFilter">Filter by Status:</label>
                    <select id="statusFilter" onchange="filterComplaints()">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="categoryFilter">Filter by Category:</label>
                    <select id="categoryFilter" onchange="filterComplaints()">
                        <option value="">All Categories</option>
                        <option value="infra">Infrastructure</option>
                        <option value="sanitation">Sanitation</option>
                        <option value="scheme">Scheme Implementation</option>
                        <option value="corruption">Corruption</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Complaints Table -->
            <div class="table-card card">
                <div id="complaintsTableContainer">
                    <!-- Table will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Complaint Details Modal -->
    <div id="complaintModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Complaint Details</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>

            <div id="complaintDetailsContainer">
                <!-- Details will be loaded here -->
            </div>

            <form id="updateStatusForm" style="display: none;">
                <div class="form-group">
                    <label for="statusInput">Update Status</label>
                    <select id="statusInput" required>
                        <option value="">Select Status</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="assignedInput">Assign To Department</label>
                    <select id="assignedInput">
                        <option value="">Unassigned</option>
                        <option value="Public Works">Public Works</option>
                        <option value="Health">Health</option>
                        <option value="Sanitation">Sanitation</option>
                        <option value="Water Supply">Water Supply</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="responseInput">Admin Response</label>
                    <textarea id="responseInput" placeholder="Add your response to the citizen..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeComplaintModal()">Cancel</button>
                    <button type="submit" class="btn-update">Update Status</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/app.js"></script>
    <script>
        /**
         * Manage Complaints Page
         */

        const complaintModal = document.getElementById('complaintModal');
        const closeModalBtn = document.getElementById('closeModal');
        const complaintsTableContainer = document.getElementById('complaintsTableContainer');
        const updateStatusForm = document.getElementById('updateStatusForm');
        const complaintDetailsContainer = document.getElementById('complaintDetailsContainer');

        let allComplaints = [];
        let currentComplaintId = null;
        let currentPanchayatId = null;

        function getCategoryIcon(category) {
            const icons = {
                'infra': 'fa-road',
                'sanitation': 'fa-trash',
                'scheme': 'fa-file-alt',
                'corruption': 'fa-exclamation-circle',
                'other': 'fa-question-circle'
            };
            return icons[category] || 'fa-exclamation-triangle';
        }

        function loadComplaints() {
            const session = requireAuth();
            if (!session || session.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }

            // Update admin name
            const adminNameSpan = document.getElementById('adminName');
            if (adminNameSpan) {
                adminNameSpan.textContent = session.userData.name || 'Admin';
            }

            currentPanchayatId = session.panchayatId;
            allComplaints = getAllComplaintsByPanchayat(currentPanchayatId);

            if (allComplaints.length === 0) {
                complaintsTableContainer.innerHTML = `
                    <div class="empty-state card">
                        <i class="fas fa-inbox"></i>
                        <h3>No Complaints</h3>
                        <p>No complaints have been filed yet.</p>
                    </div>
                `;
                return;
            }

            renderComplaints(allComplaints);
        }

        function renderComplaints(complaints) {
            if (complaints.length === 0) {
                complaintsTableContainer.innerHTML = `
                    <div class="empty-state card">
                        <i class="fas fa-filter"></i>
                        <h3>No Complaints Found</h3>
                        <p>Try adjusting your filters.</p>
                    </div>
                `;
                return;
            }

            complaintsTableContainer.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>Category</th>
                            <th>Citizen</th>
                            <th>Filed On</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${complaints.map(complaint => `
                            <tr>
                                <td><span class="complaint-id">${complaint.id}</span></td>
                                <td>${complaint.subject}</td>
                                <td><span class="category-badge"><i class="fas ${getCategoryIcon(complaint.category)}"></i> ${complaint.category}</span></td>
                                <td>${complaint.filed_by_name || 'Unknown'}</td>
                                <td>${complaint.date}</td>
                                <td><span class="status-badge status-${complaint.status.toLowerCase().replace(' ', '-')}">${complaint.status}</span></td>
                                <td>
                                    <button class="btn-sm view" onclick="viewComplaint('${complaint.id}')"><i class="fas fa-eye"></i> View</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        window.filterComplaints = function () {
            const statusFilter = document.getElementById('statusFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;

            let filtered = allComplaints;

            if (statusFilter) {
                filtered = filtered.filter(c => c.status === statusFilter);
            }

            if (categoryFilter) {
                filtered = filtered.filter(c => c.category === categoryFilter);
            }

            renderComplaints(filtered);
        };

        window.viewComplaint = function (complaintId) {
            const complaint = allComplaints.find(c => c.id === complaintId);
            if (!complaint) return;

            currentComplaintId = complaintId;

            // Show details
            complaintDetailsContainer.innerHTML = `
                <div class="complaint-detail">
                    <label>Complaint ID</label>
                    <p>${complaint.id}</p>
                </div>
                <div class="complaint-detail">
                    <label>Subject</label>
                    <p>${complaint.subject}</p>
                </div>
                <div class="complaint-detail">
                    <label>Description</label>
                    <p>${complaint.description}</p>
                </div>
                <div class="complaint-detail">
                    <label>Category</label>
                    <p><span class="category-badge"><i class="fas ${getCategoryIcon(complaint.category)}"></i> ${complaint.category}</span></p>
                </div>
                <div class="complaint-detail">
                    <label>Filed By</label>
                    <p>${complaint.filed_by_name} (${complaint.filed_by})</p>
                </div>
                <div class="complaint-detail">
                    <label>Filed On</label>
                    <p>${complaint.date}</p>
                </div>
                <div class="complaint-detail">
                    <label>Current Status</label>
                    <p><span class="status-badge status-${complaint.status.toLowerCase().replace(' ', '-')}">${complaint.status}</span></p>
                </div>
                ${complaint.assigned_to ? `
                    <div class="complaint-detail">
                        <label>Assigned To</label>
                        <p>${complaint.assigned_to}</p>
                    </div>
                ` : ''}
                ${complaint.response ? `
                    <div class="complaint-detail">
                        <label>Admin Response</label>
                        <p>${complaint.response}</p>
                    </div>
                ` : ''}
            `;

            // Show update form
            updateStatusForm.style.display = 'block';
            document.getElementById('statusInput').value = complaint.status;
            document.getElementById('assignedInput').value = complaint.assigned_to || '';
            document.getElementById('responseInput').value = complaint.response || '';

            complaintModal.classList.add('active');
        };

        function closeComplaintModal() {
            complaintModal.classList.remove('active');
            currentComplaintId = null;
            updateStatusForm.style.display = 'none';
        }

        closeModalBtn.addEventListener('click', closeComplaintModal);

        complaintModal.addEventListener('click', function (event) {
            if (event.target === complaintModal) {
                closeComplaintModal();
            }
        });

        updateStatusForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const updateData = {
                status: document.getElementById('statusInput').value,
                assigned_to: document.getElementById('assignedInput').value || null,
                response: document.getElementById('responseInput').value || null,
                resolved_date: document.getElementById('statusInput').value === 'Resolved' ? new Date().toISOString().split('T')[0] : null
            };

            updateComplaintStatus(currentPanchayatId, currentComplaintId, updateData);
            saveToStorage();

            closeComplaintModal();
            loadComplaints();
        });

        // Load complaints on page load
        document.addEventListener('DOMContentLoaded', loadComplaints);
    </script>
</body>

</html>
