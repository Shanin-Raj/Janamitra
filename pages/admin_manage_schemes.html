<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Schemes | Janamitra Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gov-header {
            background: var(--bg-white);
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 4px;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .emblem {
            height: 45px;
        }

        .logo-text .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ux4g-primary);
        }

        .logo-text .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--ux4g-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Admin Layout */
        .admin-layout {
            padding-top: 90px;
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-white);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar-menu a {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: var(--radius);
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .sidebar-menu a:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .sidebar-menu a.active {
            background: var(--ux4g-primary);
            color: white;
        }

        /* Main Content */
        .admin-content {
            padding: 2rem;
            background: var(--bg-light);
        }

        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.75rem;
            margin: 0;
        }

        /* Scheme Table */
        .table-card {
            padding: 0;
            overflow: hidden;
        }

        .table-header {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .table-header h2 {
            font-size: 1.25rem;
            margin: 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            text-align: left;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background: var(--bg-light);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .scheme-name {
            font-weight: 600;
            color: var(--text-dark);
        }

        .scheme-category {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: #e0e7ff;
            color: #4c1d95;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            margin-right: 0.5rem;
        }

        .btn-sm.edit {
            background: var(--ux4g-info);
            color: white;
        }

        .btn-sm.edit:hover {
            background: #0284c7;
        }

        .btn-sm.delete {
            background: var(--ux4g-danger);
            color: white;
        }

        .btn-sm.delete:hover {
            background: #dc2626;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-white);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-in-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--ux4g-primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: white;
        }

        .tag {
            background: var(--ux4g-primary);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .modal-footer button {
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-cancel {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }

        .btn-save {
            background: var(--ux4g-primary);
            color: white;
        }

        .btn-save:hover {
            background: #5a4fc9;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .page-header-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="tricolor-strip"></div>

    <header class="gov-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo-section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem"
                    class="emblem">
                <div class="logo-text">
                    <span class="title">JANAMITRA</span>
                    <span class="subtitle">Admin Panel</span>
                </div>
            </a>
            <div class="user-menu">
                <span>Admin: <strong id="adminName">Admin</strong></span>
                <div class="user-avatar" id="adminAvatar">AD</div>
                <a href="../index.html" class="btn btn-outline" style="padding: 8px 12px;"><i
                        class="fas fa-power-off"></i></a>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-title">Management</div>
            <ul class="sidebar-menu">
                <li><a href="admin_dashboard.html"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="admin_manage_projects.html"><i class="fas fa-project-diagram"></i> Manage Projects</a></li>
                <li><a href="admin_manage_schemes.html" class="active"><i class="fas fa-hand-holding-heart"></i> Manage
                        Schemes</a></li>
                <li><a href="#"><i class="fas fa-inbox"></i> Complaints</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content animate-fade-in">
            <div class="page-header-actions">
                <h1 class="page-title">Manage Schemes</h1>
                <button id="addSchemeBtn" class="btn btn-primary"><i class="fas fa-plus"></i> New Scheme</button>
            </div>

            <div class="table-card card">
                <div id="schemesTableContainer">
                    <!-- Table will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Scheme Modal -->
    <div id="schemeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Scheme</h2>
                <button class="modal-close" id="closeSchemeModal">&times;</button>
            </div>
            <form id="schemeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="schemeName">Scheme Name *</label>
                        <input type="text" id="schemeName" required placeholder="e.g., Old Age Pension">
                    </div>
                    <div class="form-group">
                        <label for="schemeCategory">Category *</label>
                        <select id="schemeCategory" required>
                            <option value="">Select Category</option>
                            <option value="Welfare">Welfare</option>
                            <option value="Housing">Housing</option>
                            <option value="Education">Education</option>
                            <option value="Agriculture">Agriculture</option>
                            <option value="Employment">Employment</option>
                            <option value="Sports">Sports</option>
                            <option value="Finance">Finance</option>
                            <option value="Fisheries">Fisheries</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="schemeMinistry">Ministry/Department *</label>
                        <input type="text" id="schemeMinistry" required placeholder="e.g., Ministry of Social Justice">
                    </div>
                    <div class="form-group">
                        <label for="schemeAmount">Amount/Benefit *</label>
                        <input type="text" id="schemeAmount" required placeholder="e.g., ₹1,500/month">
                    </div>
                </div>

                <div class="form-group form-row full">
                    <label for="schemeEligibility">Eligibility Criteria *</label>
                    <textarea id="schemeEligibility" required
                        placeholder="e.g., Age 60+, BPL, Indian citizen"></textarea>
                </div>

                <div class="form-group form-row full">
                    <label for="schemeDescription">Description</label>
                    <textarea id="schemeDescription" placeholder="Additional details about the scheme..."></textarea>
                </div>

                <div class="form-group form-row full">
                    <label for="schemePanchayats">Available in Panchayats *</label>
                    <div id="panchayatCheckboxes"
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem;">
                        <!-- Checkboxes will be populated here -->
                    </div>
                </div>

                <div class="form-group form-row full">
                    <label>Required Documents</label>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <input type="text" id="documentInput" placeholder="Add document and press Enter"
                            style="flex: 1;">
                    </div>
                    <div id="documentsContainer" class="tag-input-container"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelSchemeBtn">Cancel</button>
                    <button type="submit" class="btn-save">Save Scheme</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/app.js"></script>
    <script>
        /**
         * Manage Schemes Page
         */

        const schemeModal = document.getElementById('schemeModal');
        const schemeForm = document.getElementById('schemeForm');
        const closeSchemeModalBtn = document.getElementById('closeSchemeModal');
        const cancelSchemeBtn = document.getElementById('cancelSchemeBtn');
        const addSchemeBtn = document.getElementById('addSchemeBtn');
        const schemesTableContainer = document.getElementById('schemesTableContainer');
        const modalTitle = document.getElementById('modalTitle');
        const documentInput = document.getElementById('documentInput');
        const documentsContainer = document.getElementById('documentsContainer');

        let currentEditingSchemeId = null;
        let currentDocuments = [];

        // Load schemes on page load
        function loadSchemes() {
            const session = requireAuth();
            if (!session || session.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }

            // Update admin name
            const adminNameSpan = document.getElementById('adminName');
            if (adminNameSpan) {
                adminNameSpan.textContent = session.userData.name || 'Admin';
            }

            const schemes = getAllSchemes();

            if (schemes.length === 0) {
                schemesTableContainer.innerHTML = `
                    <div class="empty-state card">
                        <i class="fas fa-inbox"></i>
                        <h3>No Schemes Yet</h3>
                        <p>Start by adding your first scheme.</p>
                    </div>
                `;
                return;
            }

            schemesTableContainer.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Scheme Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Ministry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${schemes.map(scheme => `
                            <tr>
                                <td><span class="scheme-name">${scheme.name}</span></td>
                                <td><span class="scheme-category">${scheme.category}</span></td>
                                <td>${scheme.amount}</td>
                                <td>${scheme.ministry}</td>
                                <td>
                                    <button class="btn-sm edit" onclick="editScheme('${scheme.id}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button class="btn-sm delete" onclick="deleteSchemeConfirm('${scheme.id}')"><i class="fas fa-trash"></i> Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Populate panchayat checkboxes
        function populatePanchayatCheckboxes() {
            const container = document.getElementById('panchayatCheckboxes');
            const panchayatIds = Object.keys(JanamitraDB.panchayats);

            container.innerHTML = panchayatIds.map(id => `
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="panchayat" value="${id}">
                    <span>${JanamitraDB.panchayats[id].name}</span>
                </label>
            `).join('');
        }

        // Open add scheme modal
        addSchemeBtn.addEventListener('click', function () {
            currentEditingSchemeId = null;
            modalTitle.textContent = 'Add New Scheme';
            schemeForm.reset();
            currentDocuments = [];
            documentsContainer.innerHTML = '';
            populatePanchayatCheckboxes();
            schemeModal.classList.add('active');
        });

        // Close modal
        function closeSchemeModalFunc() {
            schemeModal.classList.remove('active');
            schemeForm.reset();
            currentEditingSchemeId = null;
            currentDocuments = [];
            documentsContainer.innerHTML = '';
        }

        closeSchemeModalBtn.addEventListener('click', closeSchemeModalFunc);
        cancelSchemeBtn.addEventListener('click', closeSchemeModalFunc);

        schemeModal.addEventListener('click', function (event) {
            if (event.target === schemeModal) {
                closeSchemeModalFunc();
            }
        });

        // Add document tag
        documentInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const doc = this.value.trim();
                if (doc) {
                    currentDocuments.push(doc);
                    this.value = '';
                    renderDocumentTags();
                }
            }
        });

        // Render document tags
        function renderDocumentTags() {
            documentsContainer.innerHTML = currentDocuments.map((doc, index) => `
                <div class="tag">
                    ${doc}
                    <button type="button" onclick="removeDocument(${index})">×</button>
                </div>
            `).join('');
        }

        // Remove document
        window.removeDocument = function (index) {
            currentDocuments.splice(index, 1);
            renderDocumentTags();
        };

        // Edit scheme
        window.editScheme = function (schemeId) {
            const schemes = getAllSchemes();
            const scheme = schemes.find(s => s.id === schemeId);

            if (!scheme) return;

            currentEditingSchemeId = schemeId;
            currentDocuments = [...(scheme.documents || [])];
            modalTitle.textContent = 'Edit Scheme';

            document.getElementById('schemeName').value = scheme.name;
            document.getElementById('schemeCategory').value = scheme.category;
            document.getElementById('schemeMinistry').value = scheme.ministry;
            document.getElementById('schemeAmount').value = scheme.amount;
            document.getElementById('schemeEligibility').value = scheme.eligibility;
            document.getElementById('schemeDescription').value = scheme.description || '';

            populatePanchayatCheckboxes();

            // Check relevant panchayats
            const checkboxes = document.querySelectorAll('input[name="panchayat"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = scheme.panchayats.includes(checkbox.value);
            });

            renderDocumentTags();
            schemeModal.classList.add('active');
        };

        // Delete scheme
        window.deleteSchemeConfirm = function (schemeId) {
            if (confirm('Are you sure you want to delete this scheme?')) {
                deleteScheme(schemeId);
                saveToStorage();
                loadSchemes();
            }
        };

        // Handle form submission
        schemeForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const selectedPanchayats = Array.from(document.querySelectorAll('input[name="panchayat"]:checked'))
                .map(checkbox => checkbox.value);

            if (selectedPanchayats.length === 0) {
                alert('Please select at least one panchayat');
                return;
            }

            const schemeData = {
                id: currentEditingSchemeId,
                name: document.getElementById('schemeName').value,
                category: document.getElementById('schemeCategory').value,
                ministry: document.getElementById('schemeMinistry').value,
                amount: document.getElementById('schemeAmount').value,
                eligibility: document.getElementById('schemeEligibility').value,
                description: document.getElementById('schemeDescription').value,
                documents: currentDocuments,
                panchayats: selectedPanchayats
            };

            if (currentEditingSchemeId) {
                updateScheme(currentEditingSchemeId, schemeData);
            } else {
                addNewScheme(schemeData);
            }

            saveToStorage();
            closeSchemeModalFunc();
            loadSchemes();
        });

        // Load schemes on page load
        document.addEventListener('DOMContentLoaded', loadSchemes);
    </script>
</body>

</html>
